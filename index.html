<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a4fa8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <meta name="description" content="AliBuilding — karer va maxsus texnikalar uchun ERP monitoring tizimi." />
    <title>AliBuilding — Texnika boshqaruvi</title>
    <style>
      /* JS parse qilinishidan oldin #app bo'sh bo'lib qolmasligi uchun statik splash.
         Bu blok Vue mount qilinganda avtomatik almashtiriladi. */
      #boot {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 16px;
        color: #64726a;
        font: 13px/1.4 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f5f7f5;
      }

      #boot .mark {
        width: 50px;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        border-radius: 11px;
        background: #e6f1ff;
        transform: scale(1.1);
      }

      #boot .mark span {
        position: absolute;
        width: 9px;
        height: 17px;
        border: 2px solid #1565d8;
        border-radius: 3px;
        transform: skewY(-28deg);
      }

      #boot .mark span:nth-child(1) { left: 8px; top: 11px; height: 13px; opacity: .72 }
      #boot .mark span:nth-child(2) { left: 14px; top: 8px }
      #boot .mark span:nth-child(3) { left: 20px; top: 11px; height: 13px; opacity: .72 }

      #boot .track {
        width: 140px;
        height: 4px;
        border-radius: 10px;
        background: #e3edfa;
        overflow: hidden;
      }

      #boot .track::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 10px;
        background: #1f90ff;
        animation: boot-slide 1.15s ease-in-out infinite;
      }

      @keyframes boot-slide {
        from { transform: translateX(-100%) }
        to { transform: translateX(250%) }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot .track::after { animation: none; width: 100% }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot" role="status" aria-live="polite">
        <span class="mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <p>AliBuilding tizimi yuklanmoqda…</p>
        <span class="track" aria-hidden="true"></span>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
